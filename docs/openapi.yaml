  - name: Promociones
  - name: Catálogo (administración)
  - name: Configuración
  - name: Inventario
  - name: Compras a proveedores
  - name: Reportes
  - name: Auditoría
  - name: Inteligencia artificial
  - name: Usuarios y roles
