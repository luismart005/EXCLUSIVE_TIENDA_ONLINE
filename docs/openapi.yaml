components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por el proveedor OIDC (audiencia urn:exclusive:api).
    oidc:
      type: openIdConnect
      openIdConnectUrl: /oidc/.well-known/openid-configuration
  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Llave única de la compra (UUID). Repetir la confirmación con la misma llave devuelve el mismo pedido (RNF-09).
      schema:
        type: string
        minLength: 8
        maxLength: 80
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Llave única por operación (UUID). Repetir la solicitud con la misma llave devuelve el mismo resultado sin duplicar la operación (RNF-09).
      schema:
        type: string
        minLength: 8
        maxLength: 80
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: CONFLICT
            message:
              type: string
              example: Algunos productos ya no tienen existencias suficientes.
            details:
              description: Errores por campo (validación) o datos adicionales
            errorId:
              type: string
              description: "Solo en errores 500: identificador para localizar el fallo en Auditoría → Errores técnicos (RNF-17)"
              example: 9F3A2C1B
        requestId:
          type: string
          description: Identificador de la solicitud (trazabilidad entre servicios)
  responses:
    BadRequest:
      description: Datos inválidos (validación del servidor)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sin sesión o token vencido/revocado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: El rol no tiene el permiso requerido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No existe o no pertenece al usuario
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Regla de negocio: existencias, transición de estado no permitida, límite de cupón…"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
